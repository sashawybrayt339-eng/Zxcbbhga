<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hʏᴘᴇʀᴅᴏɢ</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
  body { padding-top: env(safe-area-inset-top, 0px); }

  /* دکمه منو */
  .menu-btn {
    position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 30;
    width: 44px; height: 44px; background: transparent; border: none; cursor: pointer;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; padding: 0;
  }
  .menu-btn span {
    display: block; width: 26px; height: 3px; background: #fff; border-radius: 2px;
    transition: transform 0.3s, opacity 0.3s;
  }
  .menu-btn.open span:nth-child(1) { transform: translateY(9px) rotate(45deg); }
  .menu-btn.open span:nth-child(2) { opacity: 0; }
  .menu-btn.open span:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }

  /* منوی کشویی - نصف صفحه */
  .dropdown {
    position: fixed; top: 0; left: 0; right: 0; height: 50vh; z-index: 20;
    background: #111; border-bottom: 1px solid #333;
    padding: calc(70px + env(safe-area-inset-top, 0px)) 16px 16px;
    display: flex; flex-direction: column; gap: 12px;
    transform: translateY(-100%); transition: transform 0.3s ease;
  }
  .dropdown.show { transform: translateY(0); }
  .dropdown button {
    width: 100%; padding: 14px; background: #1a1a1a; color: #fff;
    border: 1px solid #333; border-radius: 10px; font-size: 16px; cursor: pointer;
  }
  .dropdown button:active { background: #2a2a2a; }

  /* صفحات */
  .view {
    position: fixed; inset: 0; z-index: 5; background: #000;
    padding: calc(70px + env(safe-area-inset-top, 0px)) 20px 20px;
    display: none; flex-direction: column; align-items: center; text-align: center; overflow-y: auto;
  }
  .view.active { display: flex; }

  .home-title {
    margin: auto; color: #6EE7C8; font-size: 48px; font-weight: bold; letter-spacing: 1px;
  }

  .bot-icon {
    width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 2px solid #1e90ff;
  }
  .bot-header { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 10px; }
  .bot-title { font-size: 20px; font-weight: bold; margin: 16px 0 0; }
  .open-btn {
    display: inline-block; padding: 10px 16px; background: #1e90ff; color: #fff;
    border-radius: 10px; text-decoration: none; font-size: 15px; white-space: nowrap;
  }
  .join-text { margin-top: 36px; font-size: 18px; }
  .blue-text { margin-top: 18px; color: #1e90ff; font-size: 18px; text-decoration: none; }
  .blue-text:active { opacity: 0.6; }

  .page-text { margin: auto; font-size: 18px; line-height: 2; color: #ddd; }
  .back-btn {
    margin-top: 30px; padding: 12px 24px; background: #1a1a1a; color: #fff;
    border: 1px solid #333; border-radius: 10px; text-decoration: none; font-size: 15px;
  }
  .top-box {
    position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; right: 64px; z-index: 15;
    background: rgba(110, 231, 200, 0.12); border: 1px solid #6EE7C8; border-radius: 12px;
    padding: 10px 14px; text-align: center;
  }
  .update-text { color: #6EE7C8; font-size: 13px; line-height: 1.7; margin: 0 0 6px; }
  .live-counter { color: #6EE7C8; font-size: 15px; font-weight: bold; }
</style>
</head>
<body>
<div class="top-box">
  <p class="update-text">بروزرسانی جدید قابلیت دیدن کاربران فعال از نسخه گوگل به نسخه گیت هاب پورت شد.</p>
  <div class="live-counter" id="liveCounter">کاربران فعال: …</div>
</div>


<button class="menu-btn" id="menuBtn" aria-label="منو" aria-expanded="false">

<script>
  const btn = document.getElementById('menuBtn');
  const menu = document.getElementById('dropdown');
  const views = document.querySelectorAll('.view');

  function setMenu(open) {
    btn.classList.toggle('open', open);
    menu.classList.toggle('show', open);
    btn.setAttribute('aria-expanded', open);
  }

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    setMenu(!menu.classList.contains('show'));
  });

  document.addEventListener('click', (e) => {
    if (!menu.contains(e.target) && e.target !== btn) setMenu(false);
  });

  menu.querySelectorAll('button[data-go]').forEach(b => {
    b.addEventListener('click', () => {
      setMenu(false);
      location.hash = b.dataset.go;
    });
  });

  function route() {
    const name = location.hash.replace('#', '') || 'home';
    const target = document.getElementById(name) || document.getElementById('home');
    views.forEach(v => v.classList.toggle('active', v === target));
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', route);
  route();
</script>

  const counterEl = document.getElementById('liveCounter');

  function showCount(n) {
    counterEl.textContent = 'کاربران فعال: ' + n;

  if (typeof firebase === 'undefined') {
    counterEl.textContent = 'کاربران فعال: —';

    const db = firebase.database();
    const presenceRef = db.ref('presence');

    db.ref('.info/connected').on('value', (snap) => {

        myRef.set({ t: firebase.database.ServerValue.TIMESTAMP });
      }
    });

    presenceRef.on('value', (snap) => showCount(snap.numChildren()));
